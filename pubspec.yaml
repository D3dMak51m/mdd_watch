name: mdd_watch
description: "MDD Watch Application for Fall Detection and SOS."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.1.1
  injectable: ^2.7.0
  dio: ^5.9.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  sensors_plus: ^7.0.0
  geolocator: ^14.0.1
  battery_plus: ^7.0.0
  vibration: ^3.1.4
  wakelock_plus: ^1.4.0
  permission_handler: ^12.0.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.5.0
  uuid: ^4.5.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3
  injectable_generator: ^2.11.0
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true